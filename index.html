<style>
:root{--ink:#1d1c1a;--ink2:#3d3a33;--mut:#6b6455;--line:#e6dfcc;--line2:#cfc6ae;--cream:#FAF7EE;--yel:#FFD23F;--yel-line:#C99100;--yel-tint:#FFF3C4;--yel-line2:#F2DB82;--yel-text:#6b5300;--hope:#FF7A3D;--danger:#B3261E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Hiragino Sans','Yu Gothic',system-ui,sans-serif;line-height:1.5}
body.lock{overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #1d1c1a;outline-offset:2px}
[hidden]{display:none!important}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

.top{position:relative;display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 8px 0 12px;border-bottom:1px solid var(--line);background:#fff;z-index:20}
.back{display:flex;align-items:center;gap:4px;min-height:44px;color:var(--ink2);text-decoration:none;font-size:14px;font-weight:500}
.top-r{display:flex;align-items:center}
.lang{position:relative}
.lang-btn{display:flex;align-items:center;gap:5px;height:44px;padding:0 8px;background:none;border:0;border-radius:10px;font-family:'Outfit',sans-serif;font-size:13px;font-weight:700;color:var(--ink2)}
.lang-btn[aria-expanded="true"]{background:var(--yel-tint);outline:1px solid var(--yel-line);outline-offset:-1px}
.pop{position:absolute;right:0;top:calc(100% + 4px);min-width:176px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 28px -8px rgba(0,0,0,.28);padding:6px;z-index:40}
.pop button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:48px;padding:0 12px;background:none;border:0;border-radius:10px;font-size:14.5px;font-weight:500;text-align:left}
.pop button[aria-selected="true"]{background:var(--yel-tint);font-weight:700}
.pop button.danger{color:var(--danger)}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.help{width:44px;height:44px;background:none;border:0;display:flex;align-items:center;justify-content:center}
.help span{width:24px;height:24px;border:1.5px solid var(--ink2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-size:13px;font-weight:700;color:var(--ink2)}

.body{flex:1;display:flex;flex-direction:column;gap:12px;padding:16px 14px 14px}
h1{margin:0;font-size:24px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
.sub{margin:4px 0 0;font-size:13.5px;font-weight:500;line-height:1.5;color:var(--ink2)}
.use{margin:2px 0 0;font-size:12.5px;line-height:1.5;color:var(--mut)}
.concert{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;background:#fff;border:1px solid var(--line);border-radius:12px;cursor:text}
.concert:focus-within{border-color:var(--yel-line);box-shadow:0 0 0 2px var(--yel-tint)}
.concert .lbl{flex-shrink:0;font-size:12px;color:var(--mut)}
.concert input{flex:1;min-width:0;height:44px;border:0;outline:0;background:none;font:inherit;font-size:14px;font-weight:700;color:var(--ink);text-overflow:ellipsis}
.concert input::placeholder{font-weight:400;color:#8f8878}
.concert svg{flex-shrink:0}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.rtab{min-width:72px;max-width:180px;height:44px;padding:0 20px;font-size:14px;font-weight:500;background:var(--cream);color:var(--ink2);border:1px solid var(--line);border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtab[aria-pressed="true"]{font-weight:700;background:var(--yel);color:var(--ink);border:1.5px solid var(--yel-line)}
.rtab.add{min-width:44px;width:44px;padding:0;font-size:20px;line-height:1;background:transparent;color:var(--mut);border:1px dashed var(--line2)}
.card{background:var(--cream);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;position:relative}
.card h2{margin:0;font-size:15px;font-weight:700}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mhead .l{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.mhead h2{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font-size:12px;font-weight:700;color:var(--yel-text);background:var(--yel-tint);border:1px solid var(--yel-line2);border-radius:999px;padding:3px 10px}
.mhead .r{display:flex;gap:6px;flex-shrink:0;position:relative}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 14px;font-size:14px;font-weight:700;border-radius:12px;border:1px solid var(--line2);background:#fff;color:var(--ink2)}
.btn.y{background:var(--yel);color:var(--ink);border:1.5px solid var(--yel-line)}
.btn.sq{width:44px;padding:0}
.btn.w{background:#fff}
.btn.big{height:48px;border-radius:14px;font-size:15px;width:100%}
.btn.ghost{background:transparent;border:1px dashed var(--line2);font-weight:500;color:var(--mut)}
.btn.danger{background:#fff;color:var(--danger);border-color:#e5b6b2}
.stage{height:26px;border-radius:0 0 40px 40px;background:var(--yel-tint);border-bottom:2px solid #E0A800;box-shadow:0 6px 14px -8px rgba(255,210,63,.8);color:var(--yel-text);text-align:center;font-family:'Outfit',sans-serif;font-size:11px;font-weight:700;letter-spacing:.3em;line-height:24px}
.mapwrap{background:#fff;border-radius:10px;padding:0 0 8px;position:relative}
#vp{cursor:grab;position:relative;height:200px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:10px}
#pz{position:absolute;left:0;top:0;transform-origin:0 0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;width:max-content;will-change:transform}
.srow{display:flex;gap:3px;align-items:center;justify-content:center}
.seat{width:22px;height:22px;flex-shrink:0;border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-size:10px;font-weight:500;color:var(--mut);background:var(--cream);border:1px solid var(--line2);user-select:none;-webkit-user-select:none}
.seat.on{color:var(--ink);border-color:rgba(29,28,26,.35)}
.seat.hope{color:var(--ink);border-color:var(--hope);background:repeating-linear-gradient(45deg,var(--hope) 0 2px,#fff 2px 4px)}
.rlabel{min-width:22px;height:22px;padding:0 4px;display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-size:10px;font-weight:700;color:var(--mut);white-space:nowrap}
.sdiv{display:flex;align-items:center;gap:6px;align-self:stretch;margin:3px 0}
.sdiv i{flex:1;border-top:1px dashed var(--line2)}
.sdiv span{font-family:'Outfit',sans-serif;font-size:10px;font-weight:700;color:var(--mut)}
.zoom{position:absolute;right:6px;top:6px;display:flex;flex-direction:column;gap:4px;z-index:2}
.zoom button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;color:var(--ink2)}
.entrance{display:block;text-align:right;padding:0 12px;font-size:12px;font-weight:500;color:var(--mut)}
.note{margin:0;font-size:12px;line-height:1.5;color:var(--mut);text-align:center}
.ghint{margin:-4px 0 0;font-size:12px;line-height:1.5;color:var(--mut)}
.groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.gbtn{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 10px;font-size:13.5px;font-weight:500;color:var(--ink);background:var(--cream);border:1px solid var(--line);border-radius:12px;text-align:left}
.gbtn[aria-pressed="true"]{background:var(--yel-tint);border-color:var(--yel-line)}
.gbtn .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gbtn .ct{font-family:'Outfit','Noto Sans KR',sans-serif;font-weight:500;color:var(--mut);flex-shrink:0}
.gbtn .dot{flex-shrink:0;width:14px;height:14px;border-radius:50%;border:1px solid rgba(29,28,26,.3)}
.gbtn.hope{grid-column:span 2;background:#fff;border:1px dashed var(--hope)}
.gbtn.hope[aria-pressed="true"]{background:#FFF1E8;border-style:solid}
.gbtn.hope .dot{background:repeating-linear-gradient(45deg,var(--hope) 0 2px,#fff 2px 4px);border-color:var(--hope)}
.row2{display:flex;gap:8px}
.row2 .btn{flex:1;font-weight:500}
.tchips{display:flex;gap:6px}
.tchip{flex:1;height:44px;font-size:13.5px;font-weight:500;background:#fff;color:var(--ink2);border:1px solid var(--line);border-radius:999px}
.tchip[aria-pressed="true"]{font-weight:700;background:var(--yel);color:var(--ink);border:1.5px solid var(--yel-line)}
.inc-l{margin:0;font-size:12px;color:var(--mut)}
.inc{display:flex;flex-wrap:wrap;gap:6px}
.gchip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;font-size:12.5px;font-weight:500;background:#fff;color:var(--ink2);border:1px solid var(--line);border-radius:999px}
.gchip[aria-pressed="true"]{background:var(--yel-tint);border-color:var(--yel-line);font-weight:700}
.gchip .dot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(29,28,26,.3)}
.preview{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12.5px;line-height:1.7;color:var(--ink2);white-space:pre-wrap;word-break:break-word;user-select:text;-webkit-user-select:text}
.pcount{margin:-4px 2px 0;font-size:11.5px;color:var(--mut);text-align:right}
.pcount.over{color:var(--danger);font-weight:700}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;color:var(--ink2);cursor:pointer}
.check input{width:20px;height:20px;margin:0;accent-color:var(--yel-line)}

.lumi-ft{--ft:#6b6455;margin-top:auto;padding:22px 18px 26px;text-align:center;font-size:12px;line-height:1.7;color:var(--ft)}
.lumi-ft a{color:inherit;font-weight:400;text-decoration:underline;text-decoration-color:color-mix(in srgb,currentColor 45%,transparent);text-underline-offset:3px}

.ov{position:fixed;inset:0;z-index:100;background:rgba(29,28,26,.5);display:flex;align-items:center;justify-content:center;padding:20px}
.dlg{width:100%;max-width:360px;max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px);overflow:auto;background:#fff;border-radius:20px;padding:12px 18px 18px;box-shadow:0 14px 34px -8px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:12px}
.dlg.wide{max-width:420px}
.dh{display:flex;align-items:center;justify-content:space-between}
.dh h2{margin:0;font-size:18px;font-weight:700}
.x{width:44px;height:44px;margin-right:-10px;background:none;border:0;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.steps li{display:flex;gap:12px;align-items:flex-start}
.steps .n{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--yel);border:1.5px solid var(--yel-line);display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-size:13px;font-weight:700}
.steps b{display:block;font-size:14.5px;line-height:1.4}
.steps span.d{white-space:pre-line;word-break:keep-all;display:block;margin-top:2px;font-size:12.5px;line-height:1.5;color:var(--mut)}
.gfoot{border-top:1px solid var(--line);padding-top:4px;display:flex;flex-direction:column;gap:2px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label,.fld .l{font-size:12.5px;font-weight:700;color:var(--ink2)}
.fld input[type=text],.fld input[type=number]{height:44px;padding:0 12px;border:1px solid var(--line2);border-radius:10px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
.fld .hint{font-size:12px;color:var(--mut)}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:40px;height:40px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(29,28,26,.3)}
.sw button[aria-checked="true"]{box-shadow:0 0 0 3px var(--ink)}
.dact{display:flex;gap:8px}
.dact .btn{flex:1}
.lrow{border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.lrow .f{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.lrow .f label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--mut)}
.lrow input{width:100%;height:40px;padding:0 8px;border:1px solid var(--line2);border-radius:8px;font:inherit;font-size:14px;background:#fff}
.lrow .acts{display:flex;gap:6px;justify-content:flex-end}
.lrow .acts button{width:44px;height:36px;border:1px solid var(--line2);border-radius:8px;background:#fff;font-size:14px}
.lrow.div .f{grid-template-columns:1fr}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets .btn{height:40px;font-weight:500;font-size:13px;padding:0 12px}
.imgov{flex-direction:column;gap:12px}
.imgov img{max-width:100%;max-height:calc(100dvh - 160px);border-radius:12px;background:#fff}
.imgov p{margin:0;color:#fff;font-size:14px;font-weight:700;text-align:center}

#bubble{position:fixed;z-index:300;background:var(--ink);color:#fff;font-size:13px;font-weight:500;padding:8px 12px;border-radius:10px;transform:translateX(-50%);opacity:0;pointer-events:none;transition:opacity .15s;white-space:nowrap;max-width:calc(100vw - 16px)}
#bubble::after{content:"";position:absolute;left:calc(50% + var(--ax,0px));bottom:-5px;width:10px;height:10px;background:var(--ink);transform:translateX(-50%) rotate(45deg)}
#bubble.below::after{bottom:auto;top:-5px}
</style>
</head>
<body>
<div class="app" id="app">

<header class="top">
  <a class="back" href="https://lumimori38.github.io/" data-i18n-aria="backAria">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    루미 오락실
  </a>
  <div class="top-r">
    <div class="lang">
      <button type="button" class="lang-btn" id="langBtn" aria-haspopup="listbox" aria-expanded="false" data-i18n-aria="langAria">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>
        <span id="langCode">KO</span>
      </button>
      <div class="pop" id="langMenu" role="listbox" hidden>
        <button type="button" role="option" data-lang="ko">한국어</button>
        <button type="button" role="option" data-lang="en">English</button>
        <button type="button" role="option" data-lang="ja">日本語</button>
      </div>
    </div>
    <button type="button" class="help" id="helpBtn" data-i18n-aria="help"><span>?</span></button>
  </div>
</header>

<main class="body">
  <div>
    <h1 data-i18n="title">티켓팅 좌석 매니저</h1>
    <p class="sub" data-i18n="sub"></p>
    <p class="use" data-i18n="use"></p>
  </div>

  <label class="concert">
    <span class="lbl" data-i18n="concertLabel"></span>
    <input type="text" id="concertInput" maxlength="40" autocomplete="off" data-i18n-ph="concertPh" data-i18n-aria="concertAria">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b6455" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>
  </label>

  <div class="tabs" id="tabs"></div>

  <section class="card" aria-labelledby="mapTitle">
    <div class="mhead">
      <div class="l">
        <h2 id="mapTitle"></h2>
        <span class="chip" id="heldChip"></span>
      </div>
      <div class="r">
        <button type="button" class="btn y" id="saveBtn" data-i18n-aria="saveAria">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          <span id="saveLbl" data-i18n="save"></span>
        </button>
        <button type="button" class="btn w sq" id="moreBtn" aria-haspopup="menu" aria-expanded="false" data-i18n-aria="moreAria">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
        </button>
        <div class="pop" id="moreMenu" role="menu" hidden>
          <button type="button" role="menuitem" data-act="rename" data-i18n="mRename"></button>
          <button type="button" role="menuitem" data-act="copy" data-i18n="mCopy"></button>
          <button type="button" role="menuitem" data-act="layout" data-i18n="mLayout"></button>
          <hr>
          <button type="button" role="menuitem" class="danger" data-act="reset" data-i18n="mReset"></button>
          <button type="button" role="menuitem" class="danger" data-act="delete" id="mDelete" data-i18n="mDelete"></button>
        </div>
      </div>
    </div>
    <div class="stage" aria-hidden="true">STAGE</div>
    <div class="mapwrap">
      <div id="vp" role="img" data-i18n-aria="mapAria">
        <div id="pz"></div>
        <div class="zoom">

function wrapText(c, text, maxW, maxLines) {

    if (c.measureText(line + ch).width > maxW && line) { lines.push(line); line = ch; } else line += ch;
  }
  if (line) lines.push(line);

    const kept = lines.slice(0, maxLines); let last = kept[maxLines - 1];
    while (last && c.measureText(last + '…').width > maxW) last = last.slice(0, -1);
    kept[maxLines - 1] = last + '…'; return kept;
  }

}

  font(700, 28); c.fillStyle = '#6b5300'; c.textAlign = 'center'; c.fillText(chipText, W - P - cw / 2, y + 35); c.textAlign = 'left';
  y += 50 + 28;

  const panelH = innerH + 48;

  if (cnt[HOPE]) legend.push({ name: t('hope'), n: cnt[HOPE], hope: true });

const ua = navigator.userAgent;
